<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Principal S.I.L. — logo lungo con payoff</title>
  <desc id="desc">Logo orizzontale Principal S.I.L. con payoff Synk your world, su sfondo trasparente.</desc>
  <defs>
    <linearGradient id="blue-lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="signal-lg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <style>
      .wordmark { font-family: Montserrat, Arial, sans-serif; }
    </style>
  </defs>

  <!-- simbolo -->
  <g transform="translate(24 30) scale(.57)">
    <path fill="#F8FAFC" d="M252 70h184c111 0 189 76 189 180S548 430 440 430h-88v88l-64 64V346h151c62 0 103-38 103-96s-41-96-106-96H282z"/>
    <circle cx="252" cy="70" r="25" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="4"/>
    <path fill="url(#blue-lg)" d="M216 286l64-64v245l-64 64z"/>
    <circle cx="114" cy="167" r="20" fill="none" stroke="#F8FAFC" stroke-width="12"/>
    <path d="M142 167h116" fill="none" stroke="url(#signal-lg)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="152" cy="239" r="20" fill="none" stroke="#2563EB" stroke-width="12"/>
    <path d="M181 239h68" fill="none" stroke="url(#signal-lg)" stroke-width="9" stroke-linecap="round"/>
    <text class="wordmark" x="318" y="292" font-size="88" font-weight="700" letter-spacing="-3" fill="#F8FAFC">S.I.L</text>
  </g>

  <!-- separatore -->
  <path d="M415 75v282" stroke="#F8FAFC" stroke-width="3" opacity="0.4"/>

  <!-- denominazione -->
  <text class="wordmark" x="468" y="170" font-size="100" font-weight="700" letter-spacing="-4" fill="#F8FAFC">Principal</text>
  <text class="wordmark" x="468" y="282" font-size="96" font-weight="700" letter-spacing="-3" fill="#2563EB">S.I.L.</text>

  <!-- payoff -->
  <text class="wordmark" x="470" y="356" font-size="48" font-weight="700" fill="#06B6D4">Synk</text>
  <text class="wordmark" x="605" y="356" font-size="48" font-weight="500" fill="#F8FAFC" opacity="0.7">your world</text>
</svg>
